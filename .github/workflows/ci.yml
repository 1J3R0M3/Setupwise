name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build (warnings are errors)
        run: dotnet build Setupwise.slnx -c Release
      - name: Test
        run: dotnet test --solution Setupwise.slnx -c Release --no-build

  catalog:
    name: Catalog ids exist in winget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check package ids against microsoft/winget-pkgs
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/Test-CatalogIds.ps1

  package:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build installer and portable zip
        shell: pwsh
        run: |
          $base = (dotnet msbuild src/Setupwise.App/Setupwise.App.csproj -getProperty:VersionPrefix).Trim()
          ./scripts/Build-Release.ps1 -Version "$base-ci.${{ github.run_number }}"
      - uses: actions/upload-artifact@v7
        with:
          name: Setupwise-ci-${{ github.run_number }}
          path: artifacts/dist/*
          if-no-files-found: error
          retention-days: 14
