name: Release

# Create a release by pushing a tag, e.g.:
#   git tag v0.1.1 && git push origin v0.1.1
# The version in Directory.Build.props (VersionPrefix) must match the tag.
#
# Code signing (see CODE_SIGNING.md) runs when the repository variable
# SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN are set.
# Every signing request must be approved in SignPath, so the workflow
# waits for you there (twice: app files, then the installer).

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  actions: read   # SignPath reads the uploaded artifacts

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check version
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $prefix = (dotnet msbuild src/Setupwise.App/Setupwise.App.csproj -getProperty:VersionPrefix).Trim()
          if (($version -split '-')[0] -ne $prefix) {
            throw "Tag $version does not match VersionPrefix $prefix in Directory.Build.props"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test --solution Setupwise.slnx -c Release

      - name: Publish app
        shell: pwsh
        run: ./scripts/Build-Release.ps1 -Version '${{ steps.version.outputs.version }}' -Stage Publish

      # ---- Signing round 1: our own app files -------------------------------------------------
      - name: Upload unsigned app files
        id: unsigned-app
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-app
          path: |
            artifacts/publish/Setupwise.exe
            artifacts/publish/Setupwise.dll
            artifacts/publish/Setupwise.Core.dll
          if-no-files-found: error

      - name: Sign app files
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Setupwise' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: artifacts/signed-app

      - name: Use signed app files
        if: env.SIGN == 'true'
        shell: pwsh
        run: Copy-Item artifacts/signed-app/* artifacts/publish/ -Force

      # ---- Installer and portable zip ------------------------------------------------------------
      - name: Build installer and portable zip
        shell: pwsh
        run: ./scripts/Build-Release.ps1 -Version '${{ steps.version.outputs.version }}' -Stage Package

      # ---- Signing round 2: the installer ---------------------------------------------------------
      - name: Upload unsigned installer
        id: unsigned-installer
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          path: artifacts/dist/*-Setup-x64.exe
          if-no-files-found: error

      - name: Sign installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Setupwise' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: artifacts/signed-installer

      - name: Use signed installer and update checksums
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          Copy-Item artifacts/signed-installer/* artifacts/dist/ -Force
          ./scripts/Build-Release.ps1 -Version '${{ steps.version.outputs.version }}' -Stage Checksums

      - name: Verify signatures
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem artifacts/dist/*-Setup-x64.exe) + @(Get-Item artifacts/publish/Setupwise.exe)
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file.FullName
            Write-Host "$($file.Name): $($sig.Status) ($($sig.SignerCertificate.Subject))"
            if ($sig.Status -ne 'Valid') { throw "$($file.Name) is not validly signed" }
          }

      # ---- Release --------------------------------------------------------------------------------
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          # Release notes = the matching section of CHANGELOG.md
          $changelog = Get-Content CHANGELOG.md -Raw
          $match = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|\z)")
          $notes = if ($match.Success) { $match.Groups[1].Value.Trim() } else { "Setupwise $version" }
          $notes += "`n`n---`n**Checksums:** see ``SHA256SUMS.txt``.  "
          if ($env:SIGN -eq 'true') {
            $notes += "`n**Code signing policy:** Free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org). See [CODE_SIGNING.md](https://github.com/${{ github.repository }}/blob/main/CODE_SIGNING.md)."
          }
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

          $flags = @()
          if ($version -match '-') { $flags += '--prerelease' }
          gh release create '${{ github.ref_name }}' (Get-ChildItem artifacts/dist -File).FullName `
            --title "Setupwise $version" --notes-file release-notes.md @flags
